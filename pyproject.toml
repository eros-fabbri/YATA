[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smarttrading"
version = "0.1.0"
description = "Safety-first quantitative crypto research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pyarrow>=17,<24",
  "httpx>=0.27,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
  "pandas-stubs>=2.2,<3",
]

[project.scripts]
smarttrading = "smarttrading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smarttrading = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smarttrading"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
